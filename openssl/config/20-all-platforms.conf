## -*- mode: perl; -*-

my %targets = ();

%targets = (
    ## Base for cross-compile
    "all-base" => {
        template => 1,
        cflags   => combine('-isysroot $(CROSS_TOP)/SDKs/$(CROSS_SDK) -fno-common'),
    },

    ## Base for iOS (bitcode removed — deprecated/removed in Xcode 14+)
    "ios-cross-base" => {
        inherit_from => [ "all-base" ],
        template     => 1,
        cflags       => add(sub { defined($ENV{'IOS_MIN_SDK_VERSION'}) ? '-mios-version-min=$(IOS_MIN_SDK_VERSION)' : '-mios-version-min=15.0'; }),
    },

    ## iOS simulator (x86_64)
    "ios-sim-cross-x86_64" => {
        inherit_from => [ "darwin64-x86_64-cc", "ios-cross-base" ],
        sys_id       => "iOS",
    },

    ## iOS device (arm64)
    "ios64-cross-arm64" => {
        inherit_from   => [ "darwin-common", "ios-cross-base" ],
        cflags         => add("-arch arm64"),
        bn_ops         => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        perlasm_scheme => "ios64",
        sys_id         => "iOS",
    },
);
